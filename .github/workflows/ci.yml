name: Sky's Terrain Smoother - Biomes O Plenty 1.15.2 CI

on:
  push:
    branches:
      - master-1.15.2
      - 'feature/**'
  pull_request:
    branches:
      - master-1.15.2

permissions:
  contents: read

concurrency:
  group: skysterrainsmoother-biomesoplenty-addon-1.15.2-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, test, and audit
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Java 8 toolchain
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '8.0.502+7'

      - name: Pin production Java
        run: |
          echo "SGS_JAVA8_HOME=$JAVA_HOME" >> "$GITHUB_ENV"
          echo "SBP_JAVA8_HOME=$JAVA_HOME" >> "$GITHUB_ENV"
          echo "STS_JAVA8_HOME=$JAVA_HOME" >> "$GITHUB_ENV"

      - name: Install Java 17 for Gradle
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17.0.1+12'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6

      - name: Read pinned dependency sources
        id: content
        run: |
          set -euo pipefail
          grass="$(sed -n 's/^grass.commit=//p' gradle/content-dependencies.properties)"
          [[ "$grass" =~ ^[0-9a-f]{40}$ ]]
          echo "grass=$grass" >> "$GITHUB_OUTPUT"
          pieces="$(sed -n 's/^pieces.commit=//p' gradle/content-dependencies.properties)"
          [[ "$pieces" =~ ^[0-9a-f]{40}$ ]]
          echo "pieces=$pieces" >> "$GITHUB_OUTPUT"
          terrain="$(sed -n 's/^terrain.commit=//p' gradle/content-dependencies.properties)"
          [[ "$terrain" =~ ^[0-9a-f]{40}$ ]]
          echo "terrain=$terrain" >> "$GITHUB_OUTPUT"
          bopPieces="$(sed -n 's/^bopPieces.commit=//p' gradle/content-dependencies.properties)"
          [[ "$bopPieces" =~ ^[0-9a-f]{40}$ ]]
          echo "bopPieces=$bopPieces" >> "$GITHUB_OUTPUT"
      - name: Check out SkysGrassSlabs
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: SkyBlade1978/SkysGrassSlabs
          ref: ${{ steps.content.outputs.grass }}
          path: dependencies/grass
      - name: Check out SkysBuildingPieces
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: SkyBlade1978/SkysBuildingPieces
          ref: ${{ steps.content.outputs.pieces }}
          path: dependencies/pieces
      - name: Check out SkysTerrainSmoother
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: SkyBlade1978/SkysTerrainSmoother
          ref: ${{ steps.content.outputs.terrain }}
          path: dependencies/terrain
      - name: Check out SkysBuildingPieces BOP
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: SkyBlade1978/SkysBuildingPieces-BiomesOPlenty-Addon
          ref: ${{ steps.content.outputs.bopPieces }}
          path: dependencies/bopPieces
      - name: Build development dependencies
        run: |
          set -euo pipefail
          chmod +x dependencies/*/gradlew
          (cd dependencies/grass && ./gradlew assemble --no-daemon --stacktrace)
          (cd dependencies/pieces && ./gradlew assemble --no-daemon --stacktrace)
          (cd dependencies/terrain && ./gradlew assemble -PgrassSlabsDirectory=../grass -PbuildingPiecesDirectory=../pieces --no-daemon --stacktrace)
          (cd dependencies/bopPieces && ./gradlew assemble bopDevelopmentJar -PbuildingPiecesCoreDir=../pieces --no-daemon --stacktrace)

      - name: Make the wrapper executable
        run: chmod +x ./gradlew

      - name: Clean previous outputs
        run: >-
          ./gradlew clean --no-daemon --stacktrace
          -PgrassSlabsDirectory=dependencies/grass -PbuildingPiecesDirectory=dependencies/pieces
          -PterrainDirectory=dependencies/terrain -PbuildingPiecesBopDirectory=dependencies/bopPieces

      - name: Build, test, and audit release artifacts
        run: >-
          ./gradlew check integrationTest build javadoc verifyReleaseArtifacts writeReleaseChecksums
          verifyEclipseProductionClasspath -PgrassSlabsDirectory=dependencies/grass -PbuildingPiecesDirectory=dependencies/pieces -PterrainDirectory=dependencies/terrain -PbuildingPiecesBopDirectory=dependencies/bopPieces --no-daemon --stacktrace

      - name: Bootstrap without project or user caches
        run: |
          set -euo pipefail
          copy="$RUNNER_TEMP/terrain-bop-cold"
          mkdir -p "$copy"
          git archive HEAD | tar -x -C "$copy"
          cd "$copy"
          chmod +x gradlew
          ./gradlew assemble verifyReleaseArtifacts writeReleaseChecksums --no-daemon --stacktrace \
            --gradle-user-home "$RUNNER_TEMP/terrain-bop-gradle-home" \
            -PgrassSlabsDirectory="$GITHUB_WORKSPACE/dependencies/grass" \
            -PbuildingPiecesDirectory="$GITHUB_WORKSPACE/dependencies/pieces" \
            -PterrainDirectory="$GITHUB_WORKSPACE/dependencies/terrain" \
            -PbuildingPiecesBopDirectory="$GITHUB_WORKSPACE/dependencies/bopPieces"
          cp build/release/SHA256SUMS "$RUNNER_TEMP/terrain-bop-cold-checksums"
          ./gradlew clean --offline --no-daemon --gradle-user-home "$RUNNER_TEMP/terrain-bop-gradle-home" \
            -PgrassSlabsDirectory="$GITHUB_WORKSPACE/dependencies/grass" \
            -PbuildingPiecesDirectory="$GITHUB_WORKSPACE/dependencies/pieces" \
            -PterrainDirectory="$GITHUB_WORKSPACE/dependencies/terrain" \
            -PbuildingPiecesBopDirectory="$GITHUB_WORKSPACE/dependencies/bopPieces"
          ./gradlew assemble verifyReleaseArtifacts writeReleaseChecksums --offline --no-daemon --rerun-tasks \
            --gradle-user-home "$RUNNER_TEMP/terrain-bop-gradle-home" \
            -PgrassSlabsDirectory="$GITHUB_WORKSPACE/dependencies/grass" \
            -PbuildingPiecesDirectory="$GITHUB_WORKSPACE/dependencies/pieces" \
            -PterrainDirectory="$GITHUB_WORKSPACE/dependencies/terrain" \
            -PbuildingPiecesBopDirectory="$GITHUB_WORKSPACE/dependencies/bopPieces"
          cmp "$RUNNER_TEMP/terrain-bop-cold-checksums" build/release/SHA256SUMS

      - name: Replay artifact checks offline
        run: >-
          ./gradlew assemble verifyReleaseArtifacts writeReleaseChecksums
          -PgrassSlabsDirectory=dependencies/grass -PbuildingPiecesDirectory=dependencies/pieces -PterrainDirectory=dependencies/terrain -PbuildingPiecesBopDirectory=dependencies/bopPieces --offline --no-daemon --stacktrace

      - name: Upload audited release candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: SkysTerrainSmoother-BiomesOPlenty-Addon-1.15.2-${{ github.sha }}
          if-no-files-found: error
          retention-days: 30
          path: |
            build/libs/SkysTerrainSmoother-BiomesOPlenty-Addon-0.1.0.115021.jar
            build/libs/SkysTerrainSmoother-BiomesOPlenty-Addon-0.1.0.115021-sources.jar
            build/libs/SkysTerrainSmoother-BiomesOPlenty-Addon-0.1.0.115021-javadoc.jar
            build/release/SHA256SUMS
            CHANGELOG.md

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: SkysTerrainSmoother-BiomesOPlenty-Addon-1.15.2-diagnostics-${{ github.sha }}
          if-no-files-found: ignore
          retention-days: 14
          path: |
            build/test-results/**
            build/reports/**
            build/*-run/logs/**
            build/*-run/**/*.properties
            build/problems/**
