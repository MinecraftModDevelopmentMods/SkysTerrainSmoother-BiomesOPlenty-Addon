name: Sky's Terrain Smoother - Biomes O Plenty CI

on:
  push:
    branches:
      - 'master-*'
      - 'feature/**'
  pull_request:
    branches:
      - 'master-*'

permissions:
  contents: read

concurrency:
  group: skysterrainsmootherbop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cold-neoforge-bootstrap:
    name: Cold Forge bootstrap
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install pinned Java 21 compilation toolchain
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21.0.7+6.0.LTS'

      - name: Install pinned Java 21 Gradle runtime
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21.0.7+6.0.LTS'

      - name: Pin cold-cache production Java
        run: |
          echo "SGS_JAVA21_HOME=$JAVA_HOME" >> "$GITHUB_ENV"
          echo "SBP_JAVA21_HOME=$JAVA_HOME" >> "$GITHUB_ENV"
          echo "STS_JAVA21_HOME=$JAVA_HOME" >> "$GITHUB_ENV"

      - name: Read pinned dependency sources
        id: content
        run: |
          set -euo pipefail
          grass="$(sed -n 's/^grass.commit=//p' gradle/content-dependencies.properties)"
          [[ "$grass" =~ ^[0-9a-f]{40}$ ]]
          echo "grass=$grass" >> "$GITHUB_OUTPUT"
          pieces="$(sed -n 's/^pieces.commit=//p' gradle/content-dependencies.properties)"
          [[ "$pieces" =~ ^[0-9a-f]{40}$ ]]
          echo "pieces=$pieces" >> "$GITHUB_OUTPUT"
          terrain="$(sed -n 's/^terrain.commit=//p' gradle/content-dependencies.properties)"
          [[ "$terrain" =~ ^[0-9a-f]{40}$ ]]
          echo "terrain=$terrain" >> "$GITHUB_OUTPUT"
          bopPieces="$(sed -n 's/^bopPieces.commit=//p' gradle/content-dependencies.properties)"
          [[ "$bopPieces" =~ ^[0-9a-f]{40}$ ]]
          echo "bopPieces=$bopPieces" >> "$GITHUB_OUTPUT"
      - name: Check out SkysGrassSlabs
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: SkyBlade1978/SkysGrassSlabs
          ref: ${{ steps.content.outputs.grass }}
          path: dependencies/grass
      - name: Check out SkysBuildingPieces
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: SkyBlade1978/SkysBuildingPieces
          ref: ${{ steps.content.outputs.pieces }}
          path: dependencies/pieces
      - name: Check out SkysTerrainSmoother
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: SkyBlade1978/SkysTerrainSmoother
          ref: ${{ steps.content.outputs.terrain }}
          path: dependencies/terrain
      - name: Check out SkysBuildingPieces BOP
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: SkyBlade1978/SkysBuildingPieces-BiomesOPlenty-Addon
          ref: ${{ steps.content.outputs.bopPieces }}
          path: dependencies/bopPieces
      - name: Build development dependencies
        run: |
          set -euo pipefail
          chmod +x dependencies/*/gradlew
          (cd dependencies/grass && ./gradlew assemble --no-daemon --stacktrace)
          grass="$(sed -n 's/^grass.version=//p' gradle/content-dependencies.properties)"
          grass_jar="$GITHUB_WORKSPACE/dependencies/grass/build/libs/SkysGrassSlabs-$grass.jar"
          export ORG_GRADLE_PROJECT_grassSlabsMainJar="$grass_jar"
          export ORG_GRADLE_PROJECT_grassSlabsDeobfJar="$grass_jar"
          (cd dependencies/pieces && ./gradlew assemble --no-daemon --stacktrace)
          (cd dependencies/terrain && ./gradlew assemble -PgrassSlabsDirectory=../grass -PbuildingPiecesDirectory=../pieces --no-daemon --stacktrace)
          (cd dependencies/bopPieces && ./gradlew assemble verifyNativeBopDependencies -PbuildingPiecesCoreDir=../pieces --no-daemon --stacktrace)

      - name: Bootstrap NeoForge from an empty cache
        shell: bash
        env:
          GRADLE_USER_HOME: ${{ runner.temp }}/skysterrainsmootherbop-cold-gradle
        run: |
          set -euo pipefail
          test ! -e .gradle
          test ! -e "$GRADLE_USER_HOME"
          mkdir -p "$GRADLE_USER_HOME"
          chmod +x ./gradlew
          gradle_args=(
            classes test assemble verifyReleaseArtifacts writeReleaseChecksums -PgrassSlabsDirectory=dependencies/grass -PbuildingPiecesDirectory=dependencies/pieces -PterrainDirectory=dependencies/terrain -PbuildingPiecesBopDirectory=dependencies/bopPieces
            --no-daemon --no-build-cache --stacktrace --max-workers=2
            -Dorg.gradle.java.installations.paths="$JAVA_HOME"
            -Dorg.gradle.java.installations.auto-detect=false
            -Dorg.gradle.java.installations.auto-download=false
          )
          ./gradlew "${gradle_args[@]}"
          cp build/release/SHA256SUMS "$RUNNER_TEMP/terrain-bop-cold-SHA256SUMS"

      - name: Verify same-cache bootstrap offline
        shell: bash
        env:
          GRADLE_USER_HOME: ${{ runner.temp }}/skysterrainsmootherbop-cold-gradle
        run: |
          set -euo pipefail
          gradle_args=(
            classes test assemble verifyReleaseArtifacts writeReleaseChecksums -PgrassSlabsDirectory=dependencies/grass -PbuildingPiecesDirectory=dependencies/pieces -PterrainDirectory=dependencies/terrain -PbuildingPiecesBopDirectory=dependencies/bopPieces
            --rerun-tasks --offline --no-daemon --no-build-cache --stacktrace --max-workers=2
            -Dorg.gradle.java.installations.paths="$JAVA_HOME"
            -Dorg.gradle.java.installations.auto-detect=false
            -Dorg.gradle.java.installations.auto-download=false
          )
          ./gradlew clean --offline --no-daemon --no-build-cache
          ./gradlew "${gradle_args[@]}"
          cmp build/release/SHA256SUMS "$RUNNER_TEMP/terrain-bop-cold-SHA256SUMS"

  build:
    name: Build, test, and audit
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Read target build metadata
        id: target
        shell: bash
        run: |
          set -euo pipefail
          value() { sed -n "s/^$1=//p" gradle.properties; }
          toolchain="$(value java_toolchain_version)"
          selector="$(value java_setup_version)"
          echo "java_setup_version=${selector:-$toolchain}" >> "$GITHUB_OUTPUT"
          echo "java_version=$(value java_version)" >> "$GITHUB_OUTPUT"
          echo "minecraft_version=$(value minecraft_version)" >> "$GITHUB_OUTPUT"
          echo "gradle_java_version=$(value gradle_java_toolchain_version)" >> "$GITHUB_OUTPUT"
          echo "artifact_prefix=SkysTerrainSmoother-BiomesOPlenty-Addon-$(value mod_version)" >> "$GITHUB_OUTPUT"

      - name: Install target Java toolchain
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: ${{ steps.target.outputs.java_setup_version }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6


      - name: Read pinned dependency sources
        id: content
        run: |
          set -euo pipefail
          grass="$(sed -n 's/^grass.commit=//p' gradle/content-dependencies.properties)"
          [[ "$grass" =~ ^[0-9a-f]{40}$ ]]
          echo "grass=$grass" >> "$GITHUB_OUTPUT"
          pieces="$(sed -n 's/^pieces.commit=//p' gradle/content-dependencies.properties)"
          [[ "$pieces" =~ ^[0-9a-f]{40}$ ]]
          echo "pieces=$pieces" >> "$GITHUB_OUTPUT"
          terrain="$(sed -n 's/^terrain.commit=//p' gradle/content-dependencies.properties)"
          [[ "$terrain" =~ ^[0-9a-f]{40}$ ]]
          echo "terrain=$terrain" >> "$GITHUB_OUTPUT"
          bopPieces="$(sed -n 's/^bopPieces.commit=//p' gradle/content-dependencies.properties)"
          [[ "$bopPieces" =~ ^[0-9a-f]{40}$ ]]
          echo "bopPieces=$bopPieces" >> "$GITHUB_OUTPUT"
      - name: Check out SkysGrassSlabs
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: SkyBlade1978/SkysGrassSlabs
          ref: ${{ steps.content.outputs.grass }}
          path: dependencies/grass
      - name: Check out SkysBuildingPieces
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: SkyBlade1978/SkysBuildingPieces
          ref: ${{ steps.content.outputs.pieces }}
          path: dependencies/pieces
      - name: Check out SkysTerrainSmoother
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: SkyBlade1978/SkysTerrainSmoother
          ref: ${{ steps.content.outputs.terrain }}
          path: dependencies/terrain
      - name: Check out SkysBuildingPieces BOP
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: SkyBlade1978/SkysBuildingPieces-BiomesOPlenty-Addon
          ref: ${{ steps.content.outputs.bopPieces }}
          path: dependencies/bopPieces
      - name: Build development dependencies
        run: |
          set -euo pipefail
          chmod +x dependencies/*/gradlew
          (cd dependencies/grass && ./gradlew assemble --no-daemon --stacktrace)
          grass="$(sed -n 's/^grass.version=//p' gradle/content-dependencies.properties)"
          grass_jar="$GITHUB_WORKSPACE/dependencies/grass/build/libs/SkysGrassSlabs-$grass.jar"
          export ORG_GRADLE_PROJECT_grassSlabsMainJar="$grass_jar"
          export ORG_GRADLE_PROJECT_grassSlabsDeobfJar="$grass_jar"
          (cd dependencies/pieces && ./gradlew assemble --no-daemon --stacktrace)
          (cd dependencies/terrain && ./gradlew assemble -PgrassSlabsDirectory=../grass -PbuildingPiecesDirectory=../pieces --no-daemon --stacktrace)
          (cd dependencies/bopPieces && ./gradlew assemble verifyNativeBopDependencies -PbuildingPiecesCoreDir=../pieces --no-daemon --stacktrace)

      - name: Make the wrapper executable
        run: chmod +x ./gradlew

      - name: Build, test, and audit release artifacts
        run: >-
          ./gradlew clean check build javadoc preparePackagedIntegrationProbe verifyReleaseArtifacts writeReleaseChecksums
          verifyEclipseProductionClasspath -PgrassSlabsDirectory=dependencies/grass -PbuildingPiecesDirectory=dependencies/pieces -PterrainDirectory=dependencies/terrain -PbuildingPiecesBopDirectory=dependencies/bopPieces --no-daemon --stacktrace

      - name: Replay artifact checks offline
        run: >-
          ./gradlew assemble verifyReleaseArtifacts writeReleaseChecksums -PgrassSlabsDirectory=dependencies/grass -PbuildingPiecesDirectory=dependencies/pieces -PterrainDirectory=dependencies/terrain -PbuildingPiecesBopDirectory=dependencies/bopPieces --offline --no-daemon --stacktrace

      - name: Check fresh BOP terrain and reload in NeoGradle
        shell: bash
        run: |
          set -euo pipefail
          common=(
            --mode server --directory build/ci-generation-run
            --probe build/integration-test-mod/skysterrainsmootherbop-integration-test.jar
            --gradle-argument=-PgrassSlabsDirectory=dependencies/grass
            --gradle-argument=-PbuildingPiecesDirectory=dependencies/pieces
            --gradle-argument=-PterrainDirectory=dependencies/terrain
            --gradle-argument=-PbuildingPiecesBopDirectory=dependencies/bopPieces
          )
          for dependency in run/mods/*.jar; do common+=(--extra-mod "$dependency"); done
          python3 tools/run_development_checks.py "${common[@]}" --phase fresh --fresh
          python3 tools/run_development_checks.py "${common[@]}" --phase reload

      - name: Upload audited release candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: SkysTerrainSmoother-BiomesOPlenty-Addon-${{ steps.target.outputs.minecraft_version }}-${{ github.sha }}
          if-no-files-found: error
          retention-days: 30
          path: |
            build/libs/SkysTerrainSmoother-BiomesOPlenty-Addon-0.1.0.120062.jar
            build/libs/SkysTerrainSmoother-BiomesOPlenty-Addon-0.1.0.120062-sources.jar
            build/libs/SkysTerrainSmoother-BiomesOPlenty-Addon-0.1.0.120062-javadoc.jar
            build/release/SHA256SUMS
            CHANGELOG.md

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: SkysTerrainSmoother-BiomesOPlenty-Addon-${{ steps.target.outputs.minecraft_version }}-diagnostics-${{ github.sha }}
          if-no-files-found: ignore
          retention-days: 14
          path: |
            build/test-results/**
            build/reports/**
            build/*-run/logs/**
            build/*-run/**/*.properties
            build/problems/**
